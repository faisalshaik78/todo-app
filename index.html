<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Tasks</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="notebook">
  <header class="topbar">
    <span class="tag">Today</span>
    <p class="motto">A little list for a full day.</p>
  </header>

  <h1>Daily tasks</h1>
  <p class="sub">Add what you need to do, tick it off when it's done.</p>

  <div class="add">
    <input type="text" id="newTask" placeholder="What needs doing?" maxlength="200" aria-label="New task">
    <button class="primary" id="addBtn">Add task</button>
  </div>

  <section aria-labelledby="ph">
    <div class="head"><h2 id="ph">Pending tasks</h2><span class="count" id="pendingCount">0 pending</span></div>
    <ul id="pendingList"></ul>
  </section>

  <section aria-labelledby="ch">
    <div class="head"><h2 id="ch">Completed tasks</h2><span class="count" id="completedCount">0 completed</span></div>
    <ul id="completedList"></ul>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
